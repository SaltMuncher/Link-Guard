name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: linkguard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name LinkGuard --icon assets\linkguard.ico --paths desktop --paths shared --add-data "shared\rules.json;." --add-data "assets\linkguard.png;assets" desktop\run.py

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer\windows\linkguard.nsi'

      - uses: actions/upload-artifact@v4
        with:
          name: LinkGuard-Windows
          path: |
            linkguard/dist/LinkGuard.exe
            linkguard/dist/LinkGuard-Setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            linkguard/dist/LinkGuard.exe
            linkguard/dist/LinkGuard-Setup.exe
